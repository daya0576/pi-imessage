name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      # Exercise the installed native extension, not a skipped or mocked factory.
      # This is a disposable CI-only installation; no user config or credentials.
      - name: Install native goal acceptance fixture
        run: |
          npm install --prefix "$HOME/.pi/agent/npm" --ignore-scripts --no-fund --no-audit --no-save pi-goal-x@0.32.0
          test -f "$HOME/.pi/agent/npm/node_modules/pi-goal-x/extensions/goal.ts"
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Operations regression tests
        run: python3 -m unittest discover -s ops -p 'test_*.py'
