name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag version to publish
        required: true
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          assert.notEqual(manifest.private, true);
          if (process.env.EVENT_NAME === "workflow_dispatch") {
            assert.equal(process.env.REQUESTED_VERSION, manifest.version);
          } else {
            assert.equal(process.env.REF_NAME, `v${manifest.version}`);
          }
          NODE
          node --version
          npm --version

      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:package
      - run: npm publish --ignore-scripts --access public --provenance

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          git fetch --force --no-tags --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"

          if [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ]; then
            notes_file="$(mktemp)"
            trap 'rm -f "$notes_file"' EXIT
            git for-each-ref --format='%(contents)' "refs/tags/$TAG" > "$notes_file"
            if grep -q '[^[:space:]]' "$notes_file"; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$notes_file" --verify-tag
              exit 0
            fi
          fi

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
