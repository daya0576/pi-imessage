name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version to publish from main
        required: true
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          assert.notEqual(manifest.private, true);
          if (process.env.EVENT_NAME === "workflow_dispatch") {
            assert.equal(process.env.REF_NAME, "main");
            assert.equal(process.env.REQUESTED_VERSION, manifest.version);
          } else {
            assert.equal(process.env.REF_NAME, `v${manifest.version}`);
          }
          NODE
          node --version
          npm --version

      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - run: npm publish --ignore-scripts --access public --provenance
